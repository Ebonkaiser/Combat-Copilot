# Full nginx.conf (not a conf.d snippet) -- overrides the packaged default
# so nginx can run as a non-root user in the same container as uvicorn.
# No "user" directive: nginx never starts as root here, so there's no
# privileged-bind-then-drop step to configure (nginx just warns, harmlessly,
# that the directive is ignored).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Redirected from the default /var/lib/nginx/* (root-owned) to a path
    # the non-root user can write to; created by entrypoint.sh at startup.
    # nginx creates all of these at boot regardless of which modules are
    # actually in use, so all four need redirecting, not just the ones this
    # config exercises (proxy_pass only, here).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            # Trailing slash strips the /api prefix before forwarding, so
            # the backend's own routes (mounted at root) need no changes.
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            # Must stay off: the damage-stream endpoint is SSE, and buffering
            # would hold the whole response until it ends instead of
            # forwarding tokens as they arrive.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # Hashed build output (main-<hash>.js, styles-<hash>.css, etc.) is
        # safe to cache forever -- a new build always ships a new filename,
        # so there's no staleness risk. Without this, nginx sends no
        # Cache-Control at all and browsers apply their own heuristics,
        # which is what let a stale index.html survive a rebuild+redeploy
        # during testing and request a JS filename that no longer existed
        # on the server.
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # index.html itself must never be cached -- it's what names the
        # current build's hashed filenames, and nginx's `index` directive
        # and the try_files fallback below both resolve to this same URI
        # (nginx re-evaluates location matching for that resolved URI, so
        # this block is reached from `/`, any SPA route, and directory
        # requests alike, not just a literal /index.html request).
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
