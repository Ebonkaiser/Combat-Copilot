services:
  app:
    # image + build together: `docker compose build` (local dev, Units A-C)
    # tags the local build as this name; `docker compose pull` (Droplet
    # deploy, Unit D) fetches it from the registry instead. IMAGE_NAME/TAG
    # are set by the CI deploy job's SSH session, not stored on the Droplet;
    # local runs fall back to the defaults shown.
    image: ${IMAGE_NAME:-combat-copilot}:${IMAGE_TAG:-latest}
    build:
      context: .
    # Comes back by itself after a Droplet reboot or a Docker restart. `docker compose stop` or `down`
    # keeps it stopped; on your own machine it also means a running stack restarts with Docker Desktop.
    restart: unless-stopped
    ports:
      # Plain http on every network interface by default. Behind the HTTPS front door below, set
      # APP_BIND_ADDRESS=127.0.0.1 in .env: only Caddy, on this same host, can then reach the app, and
      # the one public address is https://SITE_ADDRESS (http://<ip>:8080 stops answering from outside).
      - "${APP_BIND_ADDRESS:-0.0.0.0}:8080:8080"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - state_data:/app/state_db
      # Private campaign content (lore + starter roster per campaign). It is NOT in the
      # repo or the image: it lives in ./campaigns next to this file on the host and is
      # mounted read-only. The container's non-root user must be able to read it
      # (chmod -R a+rX campaigns). Lore is synced at startup, so restart the container
      # (docker compose restart) after changing it. An empty or missing folder is fine:
      # the app then runs anonymous-only with the public rules.
      - ./campaigns:/app/data/campaigns:ro

  # HTTPS front door: Caddy gets and renews a free Let's Encrypt certificate for SITE_ADDRESS by itself
  # and proxies to the app. OFF unless the "https" profile is on: put COMPOSE_PROFILES=https and
  # SITE_ADDRESS=<your host name> in .env (README, "HTTPS"). It needs ports 80 and 443 open to the
  # internet and SITE_ADDRESS already pointing at this host, or no certificate is issued.
  # Like Caddyfile, this file is NOT updated by the CI deploy: copy both over by hand when they change.
  caddy:
    # A major-version tag on purpose: this is the internet-facing part, so `docker compose pull` should
    # bring its security fixes.
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3; optional, browsers fall back to HTTPS over TCP
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account. Keep them: without them every restart would ask Let's
      # Encrypt for a new certificate, and its rate limits would soon say no.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  chroma_data:
  state_data:
  caddy_data:
  caddy_config:
