services:
  app:
    # image + build together: `docker compose build` (local dev, Units A-C)
    # tags the local build as this name; `docker compose pull` (Droplet
    # deploy, Unit D) fetches it from the registry instead. IMAGE_NAME/TAG
    # are set by the CI deploy job's SSH session, not stored on the Droplet;
    # local runs fall back to the defaults shown.
    image: ${IMAGE_NAME:-combat-copilot}:${IMAGE_TAG:-latest}
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - state_data:/app/state_db
      # Private campaign content (lore + starter roster per campaign). It is NOT in the
      # repo or the image: it lives in ./campaigns next to this file on the host and is
      # mounted read-only. The container's non-root user must be able to read it
      # (chmod -R a+rX campaigns). Lore is synced at startup, so restart the container
      # (docker compose restart) after changing it. An empty or missing folder is fine:
      # the app then runs anonymous-only with the public rules.
      - ./campaigns:/app/data/campaigns:ro

volumes:
  chroma_data:
  state_data:
